name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from package.json "packageManager". pnpm then
      # downloads the Node.js version pinned in "devEngines.runtime" (cached in the store).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Contrast
        run: pnpm check:contrast

      - name: Translations
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Applies every migration to a fresh local Postgres, lints the schema, and
  # checks that the committed database types match it. Auth, REST and the
  # other services aren't needed: `supabase start` still runs their schema setup.
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and apply migrations
        run: pnpm exec supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint schema
        run: pnpm exec supabase db lint --level warning --fail-on warning

      - name: Database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- apps/web/src/lib/supabase/database.gen.ts \
            || { echo "::error::Database types are stale. Run 'pnpm db:types' and commit the result."; exit 1; }

      # Edge Functions run on Deno: lint and typecheck them with the Deno
      # version of the Supabase edge runtime (printed by `supabase start`).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4

      - name: Edge Functions
        working-directory: supabase/functions
        run: |
          deno lint
          deno check --frozen */index.ts

  # Cloudflare Workers deploy: production on pushes to main, a preview URL
  # (pr-<number>-kefche.<subdomain>.workers.dev) for each same-repo pull request.
  # Needs repo variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN
  # (docs/RUNBOOK.md); skipped until they exist and for pull requests from forks.
  deploy:
    # Static name: GitHub does not evaluate expressions in the name of a skipped job.
    name: Deploy
    needs: [verify, database]
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter web build

      - name: Deploy to production
        if: github.event_name == 'push'
        run: pnpm --filter web run cf:deploy --message "${GITHUB_SHA::7}"

      - name: Upload preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          pnpm --filter web run cf:preview --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER} ${HEAD_SHA::7}" | tee wrangler.log
          url=$(grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' wrangler.log | head -n 1)
          echo "### Preview: ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"
