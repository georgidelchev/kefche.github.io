name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from package.json "packageManager". pnpm then
      # downloads the Node.js version pinned in "devEngines.runtime" (cached in the store).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Contrast
        run: pnpm check:contrast

      - name: Translations
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Cloudflare Workers deploy: production on pushes to main, a preview URL
  # (pr-<number>-kefche.<subdomain>.workers.dev) for each same-repo pull request.
  # Needs repo variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN
  # (docs/RUNBOOK.md); skipped until they exist and for pull requests from forks.
  deploy:
    # Static name: GitHub does not evaluate expressions in the name of a skipped job.
    name: Deploy
    needs: verify
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter web build

      - name: Deploy to production
        if: github.event_name == 'push'
        run: pnpm --filter web run cf:deploy --message "${GITHUB_SHA::7}"

      - name: Upload preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          pnpm --filter web run cf:preview --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER} ${HEAD_SHA::7}" | tee wrangler.log
          url=$(grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' wrangler.log | head -n 1)
          echo "### Preview: ${url:-see deploy log}" >> "$GITHUB_STEP_SUMMARY"
