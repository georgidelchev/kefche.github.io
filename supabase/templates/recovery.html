<!-- Password reset. English for now; localized, branded templates come with the email provider (Phase 21).
     The link carries a token hash for the site's callback page, so it works in any browser. -->
<h2>Reset your kefche password</h2>
<p>
  Someone asked to reset the password for this account. To choose a new password, open this link:
</p>
<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery">Set a new password</a>
</p>
<p>If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
