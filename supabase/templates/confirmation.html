<!-- Sign-up confirmation. English for now; localized, branded templates come with the email provider (Phase 21).
     The link carries a token hash for the site's callback page, so it works in any browser. -->
<h2>Confirm your kefche account</h2>
<p>Welcome to kefche! Confirm your email address to finish creating your account:</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email">Confirm my account</a></p>
<p>If you didn't sign up for kefche, you can ignore this email.</p>
